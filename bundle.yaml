# CA Practice — the profession bundle for chartered accountancy firms.
#
# Versioned data, never code: validated by bundle-lint (bundle-sdk) in this
# repo's CI and again by bundle-service before every install. Sections arrive
# milestone by milestone; v0.1 carries what M1 installs (catalog, roles,
# permissions, email) plus the client vocabulary and fields M2 builds on.
key: ca-practice
namespace: ca
version: 0.1.0
contract: 1
name: CA Practice
description: Clients, engagements per financial year, compliance deadlines, engagement letters and portal credentials for a chartered accountancy firm.

requires:
  capabilities: []

vocabulary:
  client: { one: Client, many: Clients }
  engagement: { one: Engagement, many: Engagements }
  period: { one: Financial year, many: Financial years }
  obligation: { one: Deadline, many: Deadlines }
  document: { one: Document, many: Documents }

profiles:
  client: { version: 1, schema: schemas/client.json, ui: ui/client.ui.json }
  lead: { version: 1, schema: schemas/lead.json }

identifiers:
  - { type: pan, label: PAN, pattern: "^[A-Z]{5}[0-9]{4}[A-Z]$", unique: true }
  - { type: cin, label: CIN, pattern: "^[LU][0-9]{5}[A-Z]{2}[0-9]{4}[A-Z]{3}[0-9]{6}$", unique: true }
  - { type: llpin, label: LLPIN, pattern: "^[A-Z]{3}-[0-9]{4}$", unique: true }
  - { type: tan, label: TAN, pattern: "^[A-Z]{4}[0-9]{5}[A-Z]$", unique: true }
  - { type: gstin, label: GSTIN, pattern: "^[0-9]{2}[A-Z]{5}[0-9]{4}[A-Z][1-9A-Z]Z[0-9A-Z]$", unique: true }
  - { type: din, label: DIN / DPIN, pattern: "^[0-9]{8}$", unique: false, appliesTo: person }

# The management card's title follows the constitution (WIZ-02).
peopleRoles:
  - key: director
    label: Director
    labelWhen:
      - { when: { "==": [{ var: client.attributes.constitution }, partnership] }, label: Partner }
      - { when: { "==": [{ var: client.attributes.constitution }, llp] }, label: Designated Partner }
      - { when: { "==": [{ var: client.attributes.constitution }, trust] }, label: Trustee }
      - { when: { "==": [{ var: client.attributes.constitution }, huf] }, label: Karta }
      - { when: { "==": [{ var: client.attributes.constitution }, proprietorship] }, label: Proprietor }
  - key: authorised_signatory
    label: Authorised signatory

# Prospect board columns (PROS-01), mapped onto lead statuses.
pipeline:
  - { key: lead, label: Leads, status: New }
  - { key: discussion, label: In Discussion, status: In Discussion }
  - { key: quoted, label: Quote Sent, status: Quote Sent }

catalog: catalog.yaml

permissions:
  - { code: ca.udin.manage, name: Manage UDINs, description: Record and update UDINs against signed reports }

roles: roles.yaml
email: email/
help: knowledge/
