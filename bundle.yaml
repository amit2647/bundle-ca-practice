# CA Practice — the profession bundle for chartered accountancy firms.
#
# Versioned data, never code: validated by bundle-lint (bundle-sdk) in this
# repo's CI and again by bundle-service before every install. Sections arrive
# milestone by milestone. v0.1: catalog, roles, permissions, email and the
# client vocabulary. v0.2 (M2): identifier rules by constitution, person,
# firm and signing-partner fields. v0.3 (M3): the annual engagement per
# financial year, with AGM date and previous auditor. v0.4 (M4): deadline
# rules and reminders. v0.5 (M5): the eight letters, as skeletons — every
# field, condition and pre-fill wired, the legal wording still marked
# [Wording: …] for the firm to supply (they cannot be finalized until it is).
# v0.6 (M6): the nine client portals for the credentials vault, the signed
# consent that must be on file first, and the power of attorney listing only
# the portals a client uses (FIX-22).
key: ca-practice
namespace: ca
version: 0.6.0
contract: 1
name: CA Practice
description: Clients, engagements per financial year, compliance deadlines, engagement letters and portal credentials for a chartered accountancy firm.

requires:
  capabilities: [engagements, obligations, documents, vault]

vocabulary:
  client: { one: Client, many: Clients }
  engagement: { one: Engagement, many: Engagements }
  period: { one: Financial year, many: Financial years }
  obligation: { one: Deadline, many: Deadlines }
  document: { one: Document, many: Documents }

profiles:
  client: { version: 2, schema: schemas/client.json, ui: ui/client.ui.json }
  lead: { version: 1, schema: schemas/lead.json }
  person: { version: 1, schema: schemas/person.json }
  organization: { version: 1, schema: schemas/organization.json }
  professional: { version: 1, schema: schemas/professional.json }
  engagement:
    annual: { version: 1, schema: schemas/engagement-annual.json, ui: ui/engagement-annual.ui.json }

identifiers:
  - { type: pan, label: PAN, pattern: "^[A-Z]{5}[0-9]{4}[A-Z]$", unique: true }
  # CIN for companies — required for private and public limited (WIZ-02/03).
  - type: cin
    label: CIN
    pattern: "^[LU][0-9]{5}[A-Z]{2}[0-9]{4}[A-Z]{3}[0-9]{6}$"
    unique: true
    shownWhen: &company { in: [{ var: client.attributes.constitution }, [pvt_ltd, public_ltd]] }
    requiredWhen: *company
  - type: llpin
    label: LLPIN
    pattern: "^[A-Z]{3}-[0-9]{4}$"
    unique: true
    shownWhen: { "==": [{ var: client.attributes.constitution }, llp] }
  # TAN for companies, LLPs and partnerships.
  - type: tan
    label: TAN
    pattern: "^[A-Z]{4}[0-9]{5}[A-Z]$"
    unique: true
    shownWhen: { in: [{ var: client.attributes.constitution }, [pvt_ltd, public_ltd, llp, partnership]] }
  - { type: gstin, label: GSTIN, pattern: "^[0-9]{2}[A-Z]{5}[0-9]{4}[A-Z][1-9A-Z]Z[0-9A-Z]$", unique: true }
  - { type: din, label: DIN / DPIN, pattern: "^[0-9]{8}$", unique: false, appliesTo: person }

# The management card's title follows the constitution (WIZ-02).
peopleRoles:
  - key: director
    label: Director
    labelWhen:
      - { when: { "==": [{ var: client.attributes.constitution }, partnership] }, label: Partner }
      - { when: { "==": [{ var: client.attributes.constitution }, llp] }, label: Designated Partner }
      - { when: { "==": [{ var: client.attributes.constitution }, trust] }, label: Trustee }
      - { when: { "==": [{ var: client.attributes.constitution }, huf] }, label: Karta }
      - { when: { "==": [{ var: client.attributes.constitution }, proprietorship] }, label: Proprietor }
  - key: authorised_signatory
    label: Authorised signatory

# One engagement per client per financial year (April–March), CD-09.
engagementTypes:
  - key: annual
    name: Annual engagement
    periodKind: financial_year
    periodStartMonth: 4
    stages:
      - { key: appointed, label: Appointed }
      - { key: planning, label: Planning }
      - { key: fieldwork, label: Fieldwork }
      - { key: reporting, label: Reporting }
      - { key: completed, label: Completed }

# Prospect board columns (PROS-01), mapped onto lead statuses.
pipeline:
  - { key: lead, label: Leads, status: New }
  - { key: discussion, label: In Discussion, status: In Discussion }
  - { key: quoted, label: Quote Sent, status: Quote Sent }

catalog: catalog.yaml

# Deadline rules, one file per area. Only engaged services generate
# deadlines. Accounting, PF & ESIC and PTRC/PTEC have no rules yet — to be
# confirmed with a practising CA before they are added.
obligations: rules/
# One folder per letter; the numbers set the order they are offered in (DOC-01–08).
documents: documents/

permissions:
  - { code: ca.udin.manage, name: Manage UDINs, description: Record and update UDINs against signed reports }

roles: roles.yaml
email: email/
help: knowledge/

# Portal credentials are kept only once the client's signed consent and power
# of attorney is on file (uploaded under this category).
vault:
  consentFileCategory: consent_poa_signed
  portals: portals.yaml
